<!doctype html>
<html lang="ja">
  <head>

    <meta name="color-scheme" content="dark" />
    <title>ARMORED KOALA 2 DEMO</title>

    <!--
      Only what must be on screen before the script has loaded lives here (full-window dark page + the
      boot message). Everything else is styled by src/app.css and the UI modules. No external resources.
    -->
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0d10;
        color: #e4f3f7;
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #0b0d10;
      }
      .ak2-boot {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, 'Noto Sans JP', 'Noto Sans CJK JP', 'Yu Gothic UI', 'Meiryo',
          'Hiragino Kaku Gothic ProN', sans-serif;
        text-align: center;
      }
      .ak2-boot b {
        font-size: 26px;
        letter-spacing: 0.3em;
        color: #dcfcff;
      }
      .ak2-boot span {
        font-size: 14px;
        letter-spacing: 0.12em;
        color: #a9c6ce;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="ak2-boot" data-ak2-boot>
        <b>ARMORED KOALA 2 DEMO</b>
        <span>読み込み中… LOADING</span>
        <noscript><span>このゲームの実行には JavaScript と WebGL2 が必要です。</span></noscript>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

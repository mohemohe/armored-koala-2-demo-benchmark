<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AK2 dev — garage / menus / input</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0d10;
      }
      #stage {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
      }
      #backdrop {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #ui-root {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #probe {
        position: absolute;
        left: 8px;
        top: 8px;
        z-index: 50;
        color: #cfe9ee;
        white-space: pre;
        font: 13px/1.4 ui-monospace, Menlo, Consolas, 'Noto Sans JP', 'Yu Gothic UI', 'Meiryo', monospace;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      #lock-btn {
        position: absolute;
        left: 50%;
        top: 60%;
        transform: translate(-50%, -50%);
        z-index: 50;
        padding: 14px 28px;
        font: 700 18px sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="backdrop"></canvas>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="./ui.ts"></script>
  </body>
</html>

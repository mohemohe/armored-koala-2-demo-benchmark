<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AK2 dev — stage rendering &amp; GameRenderer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d10;
        overflow: hidden;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #info {
        position: fixed;
        left: 8px;
        top: 8px;
        color: #9fe8ee;
        font: 12px/1.45 ui-monospace, Menlo, Consolas, 'Noto Sans JP', 'Yu Gothic UI', 'Meiryo', monospace;
        white-space: pre;
        text-shadow: 0 0 3px #000, 0 0 3px #000;
        pointer-events: none;
      }
      #tex {
        position: fixed;
        inset: 0;
        display: none;
        overflow: auto;
        background: #15181c;
      }
      #tex canvas {
        display: inline-block;
        margin: 2px;
      }
      /* stand-ins for the garage side panels (the real UI covers the left and right thirds) */
      .panel {
        position: fixed;
        top: 0;
        bottom: 0;
        width: 30%;
        background: rgba(6, 12, 16, 0.72);
        border: 1px solid rgba(90, 240, 255, 0.35);
        box-sizing: border-box;
        display: none;
        pointer-events: none;
      }
      #panelL {
        left: 0;
      }
      #panelR {
        right: 0;
      }
      #cross {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 40vmin;
        height: 40vmin;
        margin: -20vmin 0 0 -20vmin;
        border: 1px solid rgba(90, 240, 255, 0.5);
        border-radius: 50%;
        box-sizing: border-box;
        pointer-events: none;
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="tex"></div>
    <div id="panelL" class="panel"></div>
    <div id="panelR" class="panel"></div>
    <div id="cross"></div>
    <div id="info"></div>
    <script type="module" src="./scene.ts"></script>
  </body>
</html>

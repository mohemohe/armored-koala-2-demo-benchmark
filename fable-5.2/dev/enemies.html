<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AK2 dev — enemy models &amp; combat effects</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d10;
        overflow: hidden;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        transform-origin: 50% 50%;
      }
      #info {
        position: fixed;
        left: 8px;
        top: 8px;
        color: #9fe8ee;
        font: 12px/1.45 ui-monospace, Menlo, Consolas, 'Noto Sans JP', 'Yu Gothic UI', 'Meiryo', monospace;
        white-space: pre;
        text-shadow: 0 0 3px #000, 0 0 3px #000;
        pointer-events: none;
      }
      #labels div {
        position: fixed;
        transform: translate(-50%, 0);
        color: #ffd89a;
        font: 12px/1.3 ui-monospace, Menlo, Consolas, 'Noto Sans JP', 'Yu Gothic UI', 'Meiryo', monospace;
        text-shadow: 0 0 3px #000, 0 0 3px #000;
        white-space: nowrap;
        pointer-events: none;
      }
      /* stand-in for the HUD: crosshair + FCS lock circle (medium FCS: radius 0.20 × min(w, h)) */
      #cross {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 40vmin;
        height: 40vmin;
        margin: -20vmin 0 0 -20vmin;
        border: 1px solid rgba(90, 240, 255, 0.55);
        border-radius: 50%;
        box-sizing: border-box;
        pointer-events: none;
        display: none;
      }
      #cross::before,
      #cross::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        background: rgba(90, 240, 255, 0.9);
      }
      #cross::before {
        width: 18px;
        height: 1px;
        margin: 0 0 0 -9px;
      }
      #cross::after {
        width: 1px;
        height: 18px;
        margin: -9px 0 0 0;
      }
    </style>
  </head>
  <body>
    <div id="info"></div>
    <div id="labels"></div>
    <div id="cross"></div>
    <script type="module" src="./enemies.ts"></script>
  </body>
</html>
